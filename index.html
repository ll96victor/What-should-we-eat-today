<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e2552b">
  <meta name="description" content="今晚吃什么：一荤一素随机家常菜单，不满意就换一组，点开看做法。">
  <title>今晚吃什么</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <h1 class="hero-title">今晚吃什么</h1>
      <p class="hero-sub">一荤一素，已经帮你配好了</p>
    </header>

    <main id="menu" class="menu" aria-live="polite" aria-busy="true">
      <div class="card card--skeleton"></div>
      <div class="card card--skeleton"></div>
    </main>

    <div class="actions">
      <button id="reroll" class="btn-reroll" type="button" disabled>
        <span aria-hidden="true">🎲</span>
        <span>换一组</span>
      </button>
      <p class="hint" id="hint"></p>
    </div>
  </div>

  <div class="sheet" id="detail" hidden>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="detail-name">
      <div class="sheet-bar">
        <button class="sheet-back" id="detail-close" type="button">
          <span aria-hidden="true">‹</span> 返回
        </button>
        <span class="sheet-chip" id="detail-chip"></span>
      </div>
      <div class="sheet-body" id="detail-body" tabindex="-1"></div>
    </div>
  </div>

  <script src="app.js" type="module"></script>
</body>
</html>
